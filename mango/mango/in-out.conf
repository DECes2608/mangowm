# keyboard
repeat_rate=35
repeat_delay=250
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

#monitor
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:71.91:,x:0,y:0,primary:1
monitor_rule=name:^HDMI-A-2$,width:1920,height:1080,refresh:60.00:,x:1920,y:0,primary:0
